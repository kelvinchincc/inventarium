[package]
name = "inventarium"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dotenv = "0.15.0"
log = "0.4.34"
poem = { version = "3.1.12", features = ["csrf"] }
poem-openapi = { version = "5.1.16", features = ["swagger-ui"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["migrate", "runtime-tokio", "sqlite"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing-subscriber = "0.3.23"
